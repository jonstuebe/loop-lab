<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Loop Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#06090e">
  <style>
    /* Inline so the loading screen paints before the game's script and styles arrive. */
    #preloader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:#06090e;color:#eef2f6;
      font-family:"Rajdhani","Barlow Condensed","DIN Alternate","Arial Narrow",system-ui,sans-serif;text-transform:uppercase;transition:opacity .45s}
    #preloader.done{opacity:0;pointer-events:none}
    #preloader .pre{width:min(420px,100%)}
    #preloader h1{margin:0 0 26px;font-size:44px;line-height:1;font-weight:700;letter-spacing:.14em}
    #preloader .ring{display:inline-block;width:.5em;height:.78em;border-radius:50%;border:.05em solid #3aa0ff;vertical-align:-.06em;margin-right:.1em;
      box-shadow:0 0 .3em rgba(58,160,255,.7),inset 0 0 .2em rgba(58,160,255,.5)}
    #preloader .ring.o{border-color:#ff8c2a;margin-left:-.24em;margin-right:.22em;box-shadow:0 0 .3em rgba(255,140,42,.7),inset 0 0 .2em rgba(255,140,42,.5)}
    #preloader .track{height:3px;background:rgba(190,210,230,.16)}
    #preBar{height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#3aa0ff,#ff8c2a);transition:transform .25s ease-out}
    #preloader .row{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:13px;font-weight:600;letter-spacing:.2em;color:#93a0b0}
    #prePct{color:#eef2f6;font-variant-numeric:tabular-nums}
    #preloader.failed #preBar{background:#ff5a4d}
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="chip" id="chip" role="button" tabindex="0" aria-label="Chamber info">
    <div class="num" id="lvlNum"></div>
    <div class="name" id="lvlName"></div>
    <div class="hint" id="hint"></div>
    <div class="tap">Tap to hide</div>
  </div>
  <button class="iconbtn" id="gearBtn" aria-label="Graphics settings" title="Graphics settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <button class="iconbtn" id="menuBtn" aria-label="Main menu" title="Main menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5.5h4V20"/></svg>
  </button>
  <button class="iconbtn" id="resetBtn" aria-label="Restart chamber" title="Restart chamber (R)">↺</button>

  <svg id="xhair" viewBox="0 0 44 44" aria-hidden="true">
    <circle cx="22" cy="22" r="2.2" fill="#ffffff" stroke="#0a0d12" stroke-opacity=".6" stroke-width="1"/>
    <path id="xhB" d="M16 11.6 A12 12 0 0 0 16 32.4" stroke="#3aa0ff"/>
    <path id="xhO" d="M28 11.6 A12 12 0 0 1 28 32.4" stroke="#ff8c2a"/>
  </svg>
  <div id="toast"></div>
  <div id="resume">Click to look around</div>

  <div id="touch">
    <div id="joyBase"><div id="joyKnob"></div></div>
    <button class="tbtn" id="bBlue" aria-label="Fire blue portal"><span class="dot"></span></button>
    <button class="tbtn" id="bOrange" aria-label="Fire orange portal"><span class="dot"></span></button>
    <button class="tbtn" id="bGrab" aria-label="Grab or drop">Grab</button>
    <button class="tbtn" id="bJump" aria-label="Jump">Jump</button>
  </div>

  <div id="overlay"><div class="card" id="card"></div></div>

  <div id="preloader" role="progressbar" aria-label="Loading Loop Lab" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="pre">
      <h1><span class="ring"></span><span class="ring o"></span> Loop Lab</h1>
      <div class="track"><div id="preBar"></div></div>
      <div class="row"><span id="preLabel">Loading</span><span id="prePct">0%</span></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
